<!doctype html>
<html lang="es" data-dct-theme="dark">
<head><meta charset="utf-8"><title>Contrato válido</title></head>
<body>
  <nav class="dct-navbar dct-is-inverse" aria-label="Navegación principal">
    <a class="dct-navbar-brand" href="/">Producto</a>
    <button class="dct-button dct-navbar-toggle" type="button" aria-expanded="true" aria-controls="menu">Menú</button>
    <div class="dct-navbar-menu" id="menu"><a class="dct-navbar-item" href="/" aria-current="page">Inicio</a></div>
  </nav>
  <div class="dct-table-wrap dct-is-elevated" tabindex="0" role="region" aria-labelledby="caption">
    <table class="dct-table"><caption class="dct-table-caption" id="caption">Pedidos</caption><tbody><tr><th scope="row">Uno</th></tr></tbody></table>
  </div>
  <p class="dct-help" id="optional-help">Ayuda visual que no aporta instrucciones necesarias.</p>
  <span id="status-label">Progreso</span>
  <progress class="dct-progress" max="10" aria-labelledby="status-label"></progress>
  <input type="button" popovertarget="details" value="Ver detalles">
  <div class="dct-popover" id="details" popover>Detalles</div>
</body>
</html>
